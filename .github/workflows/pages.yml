name: Validate and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/diceify/' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate static IPA extractor
        run: python3 -m unittest discover tools/rd2-extract/tests -p 'test_*.py'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit and component tests
        run: npm test
      - name: Worker SQL and domain tests
        run: npm run test:worker
      - name: Worker type check
        run: npm run typecheck:worker
      - name: Production build
        run: npm run build
      - name: Worker deployment dry run
        run: npm run build:worker
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e -- --project=chromium --project=mobile
      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: test-results/qa-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
